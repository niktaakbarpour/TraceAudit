[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceaudit"
version = "0.1.0"
description = "Cost-efficient verification of LLM explanations for robotic failure classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.20,<5"]
authors = [{ name = "Nikta Akbarpour" }]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traceaudit.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
